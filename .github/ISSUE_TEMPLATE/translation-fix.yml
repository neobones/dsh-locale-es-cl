name: Errata de traducción
description: Un texto en español de Chile que hay que corregir o mejorar
title: "[errata] "
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Con estos datos se puede localizar la clave en un minuto.
        Si ya sabes cuál es el texto correcto, mejor abre directamente un *pull request*
        editando el fichero correspondiente de `i18n/es-cl/`.
  - type: input
    id: fichero
    attributes:
      label: Fichero del namespace
      description: El fichero de `i18n/es-cl/` donde vive el texto.
      placeholder: chat.json
    validations:
      required: true
  - type: input
    id: clave
    attributes:
      label: Clave
      description: La clave tal cual aparece en `i18n/catalog.json`.
      placeholder: message.copy
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Texto actual
      description: Lo que se ve hoy en la interfaz.
    validations:
      required: true
  - type: input
    id: propuesta
    attributes:
      label: Texto propuesto
      description: Lo que debería decir.
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Dónde se ve y por qué está mal
      description: Pantalla, momento de uso, y si es un error o una cuestión de estilo.
      placeholder: |
        Aparece al pulsar el botón de copiar en un bloque de código…
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Versión del pack
      description: La que muestra `package.json` (por ejemplo 1.0.0).
    validations:
      required: false
